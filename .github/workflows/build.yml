# Builds PipeTV on every push to main and publishes it as a GitHub release: the signed APKs
# under stable names, the release notes (what's new from CHANGELOG.md, the commits since the
# previous build, install steps, checksums) and CHANGELOG.md itself.
name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # tags and releases

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # The build number is the commit count, and the notes look back to the previous build
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: gradle

      - name: Version and build number
        id: version
        run: |
          version=$(sed -n 's/^def appVersionName = "\(.*\)"$/\1/p' PipePipeClient/app/build.gradle)
          build=$(git rev-list --count HEAD)
          previous=$(git tag --list 'build-*' --sort=-v:refname | head -n 1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "PipeTV $version, build $build (previous build: ${previous:-none})"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PIPETV_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pipetv-release.jks"

      - name: Build the release APKs
        working-directory: PipePipeClient
        env:
          KEY_PATH: ${{ runner.temp }}/pipetv-release.jks
          KEY_STORE_PASSWORD: ${{ secrets.PIPETV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PIPETV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PIPETV_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect the APKs
        run: |
          mkdir -p dist
          # Stable names, so the latest release's links never change
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            cp PipePipeClient/app/build/outputs/apk/release/PipeTV_*-"$abi"-release.apk \
              "dist/PipeTV-$abi.apk"
          done
          (cd dist && sha256sum -- *.apk > SHA256SUMS)
          cp CHANGELOG.md dist/
          ls -l dist

      - name: Release notes
        run: |
          .github/scripts/release-notes.sh "${{ steps.version.outputs.version }}" \
            "${{ steps.version.outputs.build }}" "${{ steps.version.outputs.previous }}" \
            dist > release-notes.md
          cat release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ steps.version.outputs.build }}" dist/* \
            --target "$GITHUB_SHA" \
            --title "PipeTV ${{ steps.version.outputs.version }} (build ${{ steps.version.outputs.build }})" \
            --notes-file release-notes.md \
            --latest

      - uses: actions/upload-artifact@v4
        with:
          name: PipeTV-${{ steps.version.outputs.version }}-build-${{ steps.version.outputs.build }}
          path: |
            dist
            release-notes.md
          retention-days: 30
